# Produção — VPS + Supabase + Nginx Proxy Manager
# Guia: docs/deploy-vps.md
#
#   1. cp .env.example .env   # DATABASE_URL do Supabase + WEB_URL/VITE_API_URL https
#   2. docker compose up --build -d
#   3. Configure Proxy Hosts no NPM → WEB_PORT / API_PORT
#
# Postgres local (sem Supabase):
#   docker compose --profile local-db up --build -d
#
# Dev com hot reload:
#   docker compose -f docker-compose.dev.yml up --build

services:
  postgres:
    profiles: ["local-db"]
    image: postgres:16
    container_name: sindprf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sindprf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sindprf}
      POSTGRES_DB: ${POSTGRES_DB:-sindprf}
    volumes:
      - sindprf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sindprf} -d ${POSTGRES_DB:-sindprf}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sindprf-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no .env (Supabase ou Postgres)}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL:?Defina DATABASE_URL no .env (Supabase ou Postgres)}}
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      WEB_URL: ${WEB_URL:?Defina WEB_URL no .env}
      TENANT_SEED_HOSTS: ${TENANT_SEED_HOSTS:-}
      INSTAGRAM_MOCK: ${INSTAGRAM_MOCK:-false}
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      SEED_ON_START: ${SEED_ON_START:-false}
      SEED_ADMIN_SENHA: ${SEED_ADMIN_SENHA:-}
      D8_SENHA_TEMP: ${D8_SENHA_TEMP:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:sindprfce@sindprfce.com.br}
      CONTATO_DESTINO_EMAIL: ${CONTATO_DESTINO_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - api_uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:?Defina VITE_API_URL no .env}
    container_name: sindprf-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sindprf_pgdata:
  api_uploads:
