# Desenvolvimento local (hot reload).
# Uso: docker compose -f docker-compose.dev.yml up --build
#
# Por padrão a API usa DATABASE_URL do .env da raiz (ex.: Supabase produção).
# Postgres local: docker compose -f docker-compose.dev.yml --profile local-db up --build
#   e defina DATABASE_URL=postgresql://sindprf:sindprf@postgres:5432/sindprf?schema=public

services:
  postgres:
    profiles: ["local-db"]
    image: postgres:16
    container_name: sindprf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sindprf
      POSTGRES_PASSWORD: sindprf
      POSTGRES_DB: sindprf
    ports:
      - "5432:5432"
    volumes:
      - sindprf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sindprf -d sindprf"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sindprf-api
    restart: unless-stopped
    command: ["/usr/local/bin/docker-api-dev.sh"]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque-em-producao}
      WEB_URL: http://localhost:5173
      INSTAGRAM_MOCK: ${INSTAGRAM_MOCK:-true}
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      SEED_ADMIN_SENHA: ${SEED_ADMIN_SENHA:-Admin@123}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:sindprfce@sindprfce.com.br}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_uploads:/app/apps/api/uploads
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sindprf-web
    restart: unless-stopped
    command: ["/usr/local/bin/docker-web-dev.sh"]
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  sindprf_pgdata:
  node_modules:
  api_uploads:
